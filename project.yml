name: Supervise
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 589YB7KUM9
    CODE_SIGN_STYLE: Automatic
targets:
  Supervise:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.jinjiazhang.SupervisePractice
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 小小练习场
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: 使用摄像头在本机识别跳绳和踮脚动作并计数。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSRequiresIPhoneOS: true
schemes:
  Supervise:
    build:
      targets:
        Supervise: all
